version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # Ecosystem is `bun`, not `npm`: this repo's committed lockfile is bun.lock
  # and CI runs `bun install --frozen-lockfile`. The npm ecosystem manages
  # package.json but never touches bun.lock, so every PR it opened failed with
  # "lockfile had changes, but lockfile is frozen" (#179). The bun ecosystem
  # requires bun >= 1.1.39 and the text bun.lock (not the legacy binary
  # bun.lockb); this repo pins bun 1.3.6 in ci.yml and commits text bun.lock.
  #
  # Known tradeoff: GitHub lists Dependabot *security* updates as unsupported
  # for bun. Alerts still fire and the weekly version sweep still picks up
  # patched releases, but there are no out-of-band security PRs. Worth it —
  # the alternative was an unmergeable PR every week.
  #
  # Coverage did not exist at all until #171, which is why every
  # devDependency quietly drifted for ~3 months: oxlint 13 minors behind,
  # oxfmt 13 minors, vitest a full major, and the type-checker weeks behind
  # the refresh cadence its own comment in ci.yml promised at the time.
  # Nothing was ever going to enforce that by hand.
  #
  # Grouping mirrors the pinning policy already documented in ci.yml rather
  # than inventing a new one.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # `chore(deps)` rather than the `ci(deps)` used for actions above:
      # these are package dependencies, not CI wiring. Both are release-please
      # types hidden from the changelog, so neither produces a spurious entry.
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    ignore:
      # typebox is pinned to mirror the version pi bundles, NOT to track npm
      # latest — its correct value is "whatever @earendil-works/pi-coding-agent
      # depends on", which Dependabot has no way to know. A bump here would
      # break that invariant and turn the drift check red for no reason.
      # scripts/metrics.sh owns this pin instead. See #163, #164.
      - dependency-name: "typebox"
      # @types/node tracks the `engines.node` floor (>=22), not npm latest.
      # Types describing a newer Node than we support would let tsc accept
      # APIs missing on the oldest runtime we claim to run on, and the
      # node-matrix job only catches that if a test happens to exercise them.
      # Bump this deliberately, in the same PR that raises `engines`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # oxfmt is pre-1.0 and its output is not stable across versions, so every
      # bump reformats the world and needs a .git-blame-ignore-revs follow-up
      # (see #86). Landing the oxc tools together means one reformat diff and
      # one SHA to record, not three.
      oxc-toolchain:
        patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
      # The type-checker keeps its own group so it stays independently pinnable
      # and revertable. A TypeScript bump can change diagnostics, and ci.yml
      # documents an escape hatch for that. The hatch is unusable if the revert
      # also reverts a formatting sweep. This group replaced the `tsgo` group
      # in #222, when @typescript/native-preview gave way to TypeScript 7.
      typescript:
        patterns:
          - "typescript"
      # vitest gets its own group so a framework major always arrives alone.
      # Grouped with everything else it took an innocuous @types/node bump down
      # with it: 8 failures, all from vitest 4 spy/mock lifecycle changes, on a
      # PR whose title said "2 updates" (#185). A major that needs a migration
      # should be a PR where the failures are the subject.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      dev-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
          - "typescript"
          - "vitest"
          - "@vitest/*"
