name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned to match release-please.yml. v6 ships as a Node 24
      # action; this job otherwise runs bun, not Node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned for the same reason as actions/checkout above.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin for reproducibility; bump manually or via Dependabot.
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      # Type-check before tests: type errors are a cheaper signal than
      # a full vitest run, and vitest (esbuild) strips types without
      # checking them. tsgo is @typescript/native-preview, pinned exact
      # in package.json (preview channel — no semver, daily dev builds).
      # Bump cadence: refresh roughly weekly; track issue #50.
      # Escape hatch if tsgo regresses on a real diagnostic: temporarily
      # swap this step for `bunx -p typescript tsc --noEmit -p tsconfig.json`
      # (and add `typescript` back to devDependencies) until the next
      # @typescript/native-preview release lands.
      - run: bun run typecheck

      # Format gate. oxfmt is pre-1.0 (preview channel) — output is NOT
      # guaranteed stable across versions. Pinned exact in package.json
      # for that reason. Bump policy:
      #   - Manual only (Dependabot is github-actions-only in this repo).
      #   - Expect every bump to produce a reformat-the-world diff. Land
      #     it in the same PR as the version bump (one commit each).
      #   - After the bump PR squash-merges, append the squash SHA to
      #     `.git-blame-ignore-revs` in a follow-up PR (squash-merge
      #     means the SHA doesn't exist until after merge — see #86 for
      #     the original instance of this dance).
      # Tracking issue: #53.
      - run: bun run format:check

      # Cheapest-signal-first: typecheck → lint → test. See #82 for the
      # oxlint + oxlint-tsgolint adoption rationale and pinning notes.
      - run: bun run lint

      - run: bun run test

  # The `checks` job above runs the suite on whatever Node the runner image
  # happens to ship — unpinned, one version, and one undici (the lockfile's).
  # That is not good enough for one gate in particular: the connect-time SSRF
  # DNS-rebinding guard passes an Agent to undici's fetch, and whether that
  # Agent is honored depends on the undici/Node pairing (matrix in
  # src/lib/ssrf-agent.ts). A bad pair disables the guard, so every pairing
  # this package *claims* to support has to be exercised. See #166.
  #
  # Both dimensions come from a declared support surface, so both are tested:
  # `node` mirrors `engines.node`, `undici` mirrors the `dependencies.undici`
  # range. Consumers pick their own point in that grid — the lockfile pins one
  # cell and proves nothing about the other eight.
  node-matrix:
    name: node ${{ matrix.node }} / undici ${{ matrix.undici }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every broken cell, not just the first — which pairing fails is
      # the diagnostic signal here.
      fail-fast: false
      matrix:
        # Mirrors engines.node (>=22): the majors in support as of 2026-08.
        # Add the next major when it ships; drop one when it goes EOL.
        node: ["22", "24", "26"]
        # Mirrors the major boundaries of `dependencies.undici`. Keep these two
        # in sync: widening the range without adding its major here leaves the
        # new major untested, which is how the pre-#166 gap opened.
        undici: ["6", "7", "8", "999"]
    steps:
      # SHA-pinned to match the `checks` job above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      # This is what actually selects the runtime under test: vitest spawns
      # its workers with the `node` it finds on PATH, even when launched
      # through bun. Verified — the workers report the PATH node's version and
      # its bundled undici, not bun's.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile

      # Override the lockfile's undici with the major under test. Done after
      # the frozen install so everything *else* stays lockfile-exact and this
      # is the only variable. `--no-save` keeps package.json/bun.lock clean, so
      # a stray `git diff` in a later step can't be blamed on this step.
      - run: bun add --no-save undici@${{ matrix.undici }}

      # Fail loudly if the override didn't take: a silently-unchanged undici
      # would turn eight of the nine cells into duplicates of the lockfile one
      # and report a green matrix that tested nothing.
      - name: Verify undici major under test
        run: |
          actual="$(node -p "require('undici/package.json').version")"
          echo "undici=$actual (want major ${{ matrix.undici }})"
          case "$actual" in
            ${{ matrix.undici }}.*) ;;
            *) echo "::error::expected undici ${{ matrix.undici }}.x, got $actual"; exit 1 ;;
          esac

      # Whole suite rather than a `-t` filter on the guard's describe block:
      # a filter that stops matching after a rename would skip silently and
      # still report success.
      - run: bun run test

  # The one required status check for this workflow. Branch protection binds to
  # check-run names, and node-matrix's names are derived from its matrix values
  # (`node 24 / undici 8`) — values the comments above tell maintainers to change
  # whenever a major enters or leaves support. Requiring those nine names
  # directly means adding a major mints an unrequired check (the gap this job
  # exists to close, reopened silently), and dropping one leaves a required check
  # that never reports (PRs hang pending). This job's name never changes, so an
  # axis edit needs no settings change. See .github/branch-protection.md and #215.
  ci-gate:
    needs: [checks, node-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Load-bearing. Without `always()` this job is *skipped* when a need fails,
    # and a skipped required check leaves the PR pending rather than red — the
    # failure presents as a hang, not a rejection.
    if: always()
    steps:
      # Also load-bearing. Under `always()` this job runs even when its needs
      # failed, so a gate with an empty body would report success on a broken
      # matrix: a gate that gates nothing. Any result other than "success"
      # (failure, cancelled, skipped) fails the gate — the safe direction.
      - run: |
          echo "checks=${{ needs.checks.result }} node-matrix=${{ needs.node-matrix.result }}"
          [ "${{ needs.checks.result }}" = "success" ] \
            && [ "${{ needs.node-matrix.result }}" = "success" ]
