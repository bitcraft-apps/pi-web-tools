name: contract

# The unit suite mocks node:child_process everywhere, so it proves the argv this
# package *builds* and nothing about the argv being accepted. This job installs
# every external program the package shells out to and runs test/contract/
# against the real binaries. See #216.
#
# Deliberately a separate workflow, not a job in ci.yml:
#   - It installs from three package managers plus a source build. An apt or
#     PyPI outage must not block a PR that only touches TypeScript.
#   - It needs `schedule` and `workflow_dispatch`, which ci.yml's jobs must not
#     get (a 3x3 node/undici matrix on a cron is waste).
#
# PI_CONTRACT_STRICT=1 turns a missing binary into a failure. Without it a
# broken install step would skip the matching block and report success, which is
# the exact failure mode this job exists to prevent.
#
# PI_CONTRACT_NETWORK=1 adds one live DuckDuckGo query (the only proof that ddgr
# still names the snippet field `abstract`). It runs on the weekly schedule and
# on manual dispatch only: DuckDuckGo rate-limits shared runner IPs, and a red PR
# caused by a rate limit teaches contributors to ignore this job.
#
# The `rdrview-pin-drift` job is the refresh cadence for RDRVIEW_SHA. Every other
# pinned version in this repo ages through Dependabot, but a SHA in a `run:` step
# is invisible to it. The job compares the pin against upstream master on the same
# weekly cron. It is a separate job on purpose: a stale pin must never look like a
# broken argv. See #237.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 09:00 UTC, same slot as preview-image-check's head-check.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Workflow level, not step level: two jobs read this value — the source build and
# the drift check that ages it. One definition means the drift check can never
# compare a SHA the build does not use.
env:
  RDRVIEW_SHA: 93c3c59e61868f3de76984d59c272b9bc6af0159

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA-pinned to match ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pandoc, w3m: the two HTML->markdown converters.
      # poppler-utils: pdftotext.
      # lib*-dev: build dependencies of rdrview, built from source below.
      - name: Install pandoc, w3m, pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc w3m poppler-utils \
            libxml2-dev libseccomp-dev libcurl4-openssl-dev

      # pipx, not apt: `pipx install trafilatura` is the install path this
      # package recommends to users (src/lib/extract.ts), and apt has no
      # trafilatura at all. ddgr is in apt but lags upstream, and pip is one of
      # the three install routes src/lib/ddgr.ts prints in its "not installed"
      # hint. pipx ships on the runner image.
      - name: Install trafilatura and ddgr
        run: |
          pipx install trafilatura
          pipx install ddgr

      # rdrview has no apt package and no homebrew formula — a source build is
      # the only install route, which is also why src/lib/extract.ts probes
      # trafilatura first. Pinned to a commit: upstream tags are rare, and an
      # unpinned clone would make this job's result depend on the day.
      #
      # Refresh cadence: the `rdrview-pin-drift` job below, on the weekly cron.
      # That job is the trigger — there is no manual pass to remember. When it
      # goes red, set RDRVIEW_SHA to the SHA it reports, in its own PR. The
      # contract job on that PR is the proof that the argv still holds.
      #
      # As of 2026-08 the pin is tag v0.1.5 and also master HEAD, so the pin and
      # a fresh user `make` build are the same bytes. See #237.
      - name: Build rdrview from source
        run: |
          git clone --filter=blob:none https://github.com/eafer/rdrview.git /tmp/rdrview
          cd /tmp/rdrview
          git checkout "$RDRVIEW_SHA"
          make
          sudo make install

      # SHA-pinned to match ci.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      - name: Report the versions under test
        run: |
          pandoc --version | head -1
          w3m -version | head -1
          trafilatura --version
          rdrview -v 2>&1 | head -1 || true
          pdftotext -v 2>&1 | head -1
          ddgr --version 2>&1 | head -1

      - run: bun run test:contract
        env:
          PI_CONTRACT_STRICT: "1"
          # Live network on the weekly run and on manual dispatch only.
          PI_CONTRACT_NETWORK:
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' ||
            '0' }}

  # The cadence for the RDRVIEW_SHA pin above (#237). Users install rdrview by
  # building master, so the contract job only proves something about the rdrview
  # users have if the pin tracks master.
  #
  # Its own job, not a step in `contract`: a red drift check must stay
  # distinguishable from a red contract job. Merging the two gives the exact
  # signal #237 refuses — a failure that could be either a broken argv or an
  # upstream commit that landed this morning.
  #
  # `schedule` and `workflow_dispatch` only. Upstream activity must not redden a
  # PR or a merge to main. The check reports on the Monday cron, and GitHub mails
  # the maintainer when a scheduled run fails. It fails instead of warning: a
  # warning annotation on a cron run is read by nobody.
  #
  # NOT a required status check. `contract` is (.github/branch-protection.md); this
  # job is skipped on pull requests, so requiring it would block every merge on a
  # check that never reports.
  rdrview-pin-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout: `git ls-remote` needs no local repo, and RDRVIEW_SHA comes
      # from the workflow env.
      - name: Compare the pin against upstream master
        run: |
          set -euo pipefail
          upstream=$(git ls-remote https://github.com/eafer/rdrview.git refs/heads/master | cut -f1)
          # ls-remote exits 0 and prints nothing when the ref does not exist, so
          # an empty result is a renamed branch or a moved repo, not a stale pin.
          if [ -z "$upstream" ]; then
            echo "ERROR: rdrview has no refs/heads/master. The branch was renamed, or the repo moved." >&2
            exit 1
          fi
          echo "pinned:   $RDRVIEW_SHA"
          echo "upstream: $upstream"
          # Report a tag on the upstream commit. It tells the maintainer whether a
          # refresh moves the pin to a release or to an untagged commit. Reported
          # only — the comparison above is against master, because master is what
          # a user builds.
          # An annotated tag needs the peeled `^{}` row to match a commit SHA, so
          # both the prefix and the suffix come off the printed name.
          git ls-remote --tags https://github.com/eafer/rdrview.git \
            | awk -v sha="$upstream" '$1 == sha {
                sub(/^refs\/tags\//, "", $2)
                sub(/\^\{\}$/, "", $2)
                print "upstream tag: " $2
              }'
          if [ "$upstream" != "$RDRVIEW_SHA" ]; then
            echo "ERROR: the rdrview pin is behind upstream master." >&2
            echo "       Set RDRVIEW_SHA in this workflow to $upstream, in its own PR. See #237." >&2
            exit 1
          fi
          echo "ok: the pin matches upstream master"
