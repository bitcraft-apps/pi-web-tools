name: dependabot-lockfile

# Dependabot cannot update `bun.lock` — it has no bun support, so it edits
# package.json and leaves the lockfile untouched. CI runs
# `bun install --frozen-lockfile`, which then fails with "lockfile had changes,
# but lockfile is frozen". Every Dependabot PR is therefore unmergeable until
# someone refreshes the lockfile by hand. See #179.
#
# Why a scheduled job rather than a `pull_request` trigger: workflows triggered
# by Dependabot events read a *separate* Dependabot secret store, not the
# Actions secrets that release-please.yml already uses successfully. Running on
# `schedule`/`workflow_dispatch` is an ordinary event, so the existing app
# credentials are known to work — and it avoids `pull_request_target`, which
# would mean a privileged context checking out PR head.

on:
  schedule:
    # Daily. Dependabot itself runs weekly, so this only has work to do after
    # a bump lands, but a daily pass keeps the turnaround under a day.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile
  cancel-in-progress: false

jobs:
  refresh-bun-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same app as release-please.yml. Pushing as the app (not GITHUB_TOKEN)
      # matters twice over: GITHUB_TOKEN cannot push to a Dependabot branch with
      # the permissions this event grants, and GitHub suppresses workflow runs
      # for events produced by GITHUB_TOKEN (see #28), so CI would not re-run on
      # the refreshed branch.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # SHA-pinned to match the other workflows.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: refresh bun.lock on open dependabot PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "bitcraft-release[bot]"
          git config user.email "bitcraft-release[bot]@users.noreply.github.com"

          branches="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --author "app/dependabot" --json headRefName -q '.[].headRefName')"

          if [ -z "$branches" ]; then
            echo "No open Dependabot PRs."
            exit 0
          fi

          rc=0
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "::group::$branch"

            git checkout -B "$branch" "origin/$branch"

            # --lockfile-only: resolve and write bun.lock without installing.
            # --ignore-scripts: do not run this package's lifecycle scripts.
            # (bun never runs *dependency* scripts unless trustedDependencies,
            # so a freshly bumped dep cannot execute code here.)
            if ! bun install --lockfile-only --ignore-scripts; then
              echo "::error::bun install failed on $branch"
              rc=1
              echo "::endgroup::"
              continue
            fi

            if git diff --quiet -- bun.lock; then
              echo "bun.lock already current."
            else
              git add bun.lock
              git commit -m "chore(deps): refresh bun.lock for $branch"
              git push origin "$branch"
              echo "Pushed refreshed bun.lock."
            fi
            echo "::endgroup::"
          done <<< "$branches"

          exit "$rc"
